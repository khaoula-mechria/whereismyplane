name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Installer les dépendances
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Typage
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Scan de secrets
        run: uv run python scripts/check_secrets.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synthèse CDK (sans compte AWS, aucun déploiement)
        run: |
          uv run python scripts/build_lambda_context.py
          npx --yes aws-cdk@2.1147.0 synth -q -c budget_email=ci@example.com
