[project]
name = "aeropulse"
version = "0.0.1"
description = "AeroPulse : prédiction et analyse des retards de vols (JFK, EWR, LGA)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "tzdata",  # fuseau America/New_York sous Windows
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pandas-stubs>=3.1.0.261029",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeropulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
