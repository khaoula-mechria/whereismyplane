repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: secrets
        name: scan de secrets
        entry: uv run python scripts/check_secrets.py
        language: system
        pass_filenames: false
